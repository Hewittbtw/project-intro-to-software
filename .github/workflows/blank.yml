name: Run Python Tests  # Name shown in the Actions tab

on:
  push:
    branches:
      - main            # Run when code is pushed to main
  pull_request:
    branches:
      - main            # Also run on PRs targeting main

jobs:
  test:
    runs-on: ubuntu-latest  # Use a Linux virtual machine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4   # Official action to download your repo

      - name: Set up Python
        uses: actions/setup-python@v5   # Official action to install Python
        with:
          python-version: '3.x'         # Use latest Python 3 version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip   # Upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Install dependencies if requirements.txt exists

      - name: Run tests
        run: |
          pytest   # Run tests using pytest
